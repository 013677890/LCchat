services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    command:
      - mysqld
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat_server}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - chat-network
  redis:
    image: ${REDIS_IMAGE:-redis:7.2}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - chat-network
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.2}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - chat-network
  kafka-connect:
    image: ${KAFKA_CONNECT_IMAGE:-quay.io/debezium/connect:3.0.8.Final}
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "lcchat-kafka-connect"
      CONFIG_STORAGE_TOPIC: "lcchat_connect_configs"
      OFFSET_STORAGE_TOPIC: "lcchat_connect_offsets"
      STATUS_STORAGE_TOPIC: "lcchat_connect_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: "kafka-connect"
      REST_PORT: "8083"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - chat-network
  cdc-init:
    image: curlimages/curl:8.13.0
    restart: "no"
    env_file:
      - ./deploy/env/chatserver.env
    volumes:
      - ./scripts/cdc/register_outbox_connector.sh:/scripts/register_outbox_connector.sh:ro
    entrypoint: ["sh", "/scripts/register_outbox_connector.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    networks:
      - chat-network
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-01-20T14-49-07Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - chat-network
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/auth
    command: ["go", "run", "./cmd"]
    env_file:
      - ./deploy/env/chatserver.env
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_DSN: root:root@tcp(mysql:3306)/chat_server?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_USER_CREATED_TOPIC: user_created
      KAFKA_PROFILE_DISPLAY_CHANGED_TOPIC: profile_display_changed
      KAFKA_ACCOUNT_DELETED_TOPIC: account.deleted
      AUTH_GRPC_ADDR: ":9090"
      AUTH_METRICS_ADDR: ":9190"
      EMAIL_SENDER: ${EMAIL_SENDER:-2315635418@qq.com}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-LCChat}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.qq.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_AUTH_CODE: ${EMAIL_AUTH_CODE}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cdc-init:
        condition: service_completed_successfully
    ports:
      - "${AUTH_GRPC_PORT:-19090}:9090"
      - "${AUTH_METRICS_PORT:-19190}:9190"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9190/metrics >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - chat-network
  user:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/user
    command: ["go", "run", "./cmd"]
    env_file:
      - ./deploy/env/chatserver.env
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_DSN: root:root@tcp(mysql:3306)/chat_server?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_USER_CREATED_TOPIC: user_created
      KAFKA_PROFILE_DISPLAY_CHANGED_TOPIC: profile_display_changed
      KAFKA_ACCOUNT_DELETED_TOPIC: account.deleted
      USER_GRPC_ADDR: ":9094"
      USER_METRICS_ADDR: ":9194"
      EMAIL_SENDER: ${EMAIL_SENDER:-2315635418@qq.com}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-LCChat}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.qq.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_AUTH_CODE: ${EMAIL_AUTH_CODE}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cdc-init:
        condition: service_completed_successfully
    ports:
      - "${USER_GRPC_PORT:-19094}:9094"
      - "${USER_METRICS_PORT:-19194}:9194"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9194/metrics >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - chat-network
  relation:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/relation
    command: ["go", "run", "./cmd"]
    env_file:
      - ./deploy/env/chatserver.env
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_DSN: root:root@tcp(mysql:3306)/chat_server?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_ACCOUNT_DELETED_TOPIC: account.deleted
      RELATION_GRPC_ADDR: ":9093"
      RELATION_METRICS_ADDR: ":9193"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cdc-init:
        condition: service_completed_successfully
    ports:
      - "${RELATION_GRPC_PORT:-19093}:9093"
      - "${RELATION_METRICS_PORT:-19193}:9193"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9193/metrics >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - chat-network
  msg:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/msg
    command: ["go", "run", "./cmd"]
    env_file:
      - ./deploy/env/chatserver.env
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_DSN: root:root@tcp(mysql:3306)/chat_server?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_MSG_PUSH_TOPIC: msg.push
      MSG_GRPC_ADDR: ":9092"
      MSG_METRICS_ADDR: ":9192"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${MSG_GRPC_PORT:-19092}:9092"
      - "${MSG_METRICS_PORT:-19192}:9192"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9192/metrics >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - chat-network
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/gateway
    command: ["go", "run", "./cmd"]
    env_file:
      - ./deploy/env/chatserver.env
    environment:
      TZ: ${TZ:-UTC}
      GIN_MODE: ${GIN_MODE:-release}
      AUTH_SERVICE_ADDR: "auth:9090"
      USER_SERVICE_ADDR: "user:9094"
      RELATION_SERVICE_ADDR: "relation:9093"
      MSG_SERVICE_ADDR: "msg:9092"
      GATEWAY_ADDR: ":8080"
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      relation:
        condition: service_healthy
      msg:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - chat-network
  connect:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/connect
    command: ["go", "run", "./cmd"]
    env_file:
      - ./deploy/env/chatserver.env
    environment:
      TZ: ${TZ:-UTC}
      GIN_MODE: ${GIN_MODE:-release}
      REDIS_ADDR: redis:6379
      AUTH_GRPC_ADDR: auth:9090
      CONNECT_ADDR: ":8081"
      CONNECT_GRPC_ADDR: ":9091"
      CONNECT_SELF_GRPC_ADDR: connect:9091
    depends_on:
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${CONNECT_HTTP_PORT:-8081}:8081"
      - "${CONNECT_GRPC_PORT:-19091}:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - chat-network
  message-push:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/message-push
    command: ["go", "run", "./cmd"]
    env_file:
      - ./deploy/env/chatserver.env
    environment:
      TZ: ${TZ:-UTC}
      GIN_MODE: ${GIN_MODE:-release}
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_MSG_PUSH_TOPIC: msg.push
      KAFKA_MSG_PUSH_GROUP_ID: message-push-consumer-group
      USER_GRPC_ADDR: user:9094
      MESSAGE_PUSH_HTTP_ADDR: ":8084"
    depends_on:
      user:
        condition: service_healthy
      connect:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${MESSAGE_PUSH_HTTP_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - chat-network
  blackbox:
    image: curlimages/curl:8.13.0
    profiles: ["blackbox"]
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        echo "[blackbox] waiting gateway..."
        until curl -fsS http://gateway:8080/health >/dev/null; do sleep 1; done
        echo "[blackbox] gateway health ok"
        curl -fsS http://gateway:8080/health
        code=$$(curl -s -o /dev/null -w "%{http_code}" http://gateway:8080/api/v1/auth/blacklist)
        test "$$code" = "401"
        echo "[blackbox] auth middleware smoke check passed"
networks:
  chat-network:
    driver: bridge
volumes:
  mysql-data:
  redis-data:
  minio-data:
