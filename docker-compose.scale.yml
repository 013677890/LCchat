name: lcchat

x-app-scale: &app-scale
  deploy:
    replicas: 3

# Plain Compose replicas cannot inject a different SNOWFLAKE_NODE_ID into each replica.
# Keep services that generate Snowflake IDs singleton until they are expanded into
# explicit per-node services or moved to an orchestrator with per-pod node assignment.
x-id-generator-singleton: &id-generator-singleton
  deploy:
    replicas: 1

x-connect-node: &connect-node
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  working_dir: /app/apps/connect
  command: ["/app/bin/connect"]
  env_file:
    - ./deploy/env/chatserver.env
  environment:
    TZ: ${TZ:-UTC}
    GIN_MODE: ${GIN_MODE:-release}
    REDIS_ADDR: redis:6379
    AUTH_GRPC_ADDR: auth:9090
    CONNECT_ADDR: ":8081"
    CONNECT_GRPC_ADDR: ":9091"
  depends_on:
    auth:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 20s
  networks:
    - chat-network

services:
  kafka-topics-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.2}
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        # 空数据基线：业务 topic 固定 3 partitions。不在应用进程内 alter。
        # 若本地已存在错误 partition 数的旧 topic，应停写排空后删除重建，禁止假设在线扩容后同群历史顺序仍成立。
        topics="auth.redis.invalidate user.redis.invalidate relation.redis.invalidate user_created profile_display_changed account.deleted msg.push realtime.push group.cache"
        for topic in $$topics; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic group.cache
    networks:
      - chat-network

  auth:
    <<: *id-generator-singleton
    ports: !reset []
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully

  user:
    <<: *id-generator-singleton
    ports: !reset []
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully

  relation:
    <<: *app-scale
    ports: !reset []
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully

  group:
    <<: *id-generator-singleton
    ports: !reset []
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully

  msg:
    <<: *id-generator-singleton
    ports: !reset []
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully

  gateway:
    <<: *app-scale
    ports: !reset []

  connect:
    ports: !reset []
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully

  connect-2:
    <<: *connect-node
    environment:
      TZ: ${TZ:-UTC}
      GIN_MODE: ${GIN_MODE:-release}
      REDIS_ADDR: redis:6379
      AUTH_GRPC_ADDR: auth:9090
      CONNECT_ADDR: ":8081"
      CONNECT_GRPC_ADDR: ":9091"
      CONNECT_SELF_GRPC_ADDR: connect-2:9091

  connect-3:
    <<: *connect-node
    environment:
      TZ: ${TZ:-UTC}
      GIN_MODE: ${GIN_MODE:-release}
      REDIS_ADDR: redis:6379
      AUTH_GRPC_ADDR: auth:9090
      CONNECT_ADDR: ":8081"
      CONNECT_GRPC_ADDR: ":9091"
      CONNECT_SELF_GRPC_ADDR: connect-3:9091

  message-push:
    <<: *app-scale
    ports: !reset []
    depends_on:
      connect-2:
        condition: service_healthy
      connect-3:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully

  gateway-lb:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${GATEWAY_LB_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/gateway-lb.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - chat-network

  connect-lb:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      connect:
        condition: service_healthy
      connect-2:
        condition: service_healthy
      connect-3:
        condition: service_healthy
    ports:
      - "${CONNECT_LB_HTTP_PORT:-8081}:8081"
    volumes:
      - ./deploy/nginx/connect-lb.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - chat-network
