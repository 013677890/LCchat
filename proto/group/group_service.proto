syntax = "proto3";
package group;
option go_package = "github.com/013677890/LCchat-Backend/apps/group/pb";
import "validate/validate.proto";
// ==================== 群组服务接口 ====================
// 服务名：GroupService
// 职责：群资料、群成员、群角色、入群审批
service GroupService {
	rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
	rpc DismissGroup(DismissGroupRequest) returns (DismissGroupResponse);
	rpc GetGroupInfo(GetGroupInfoRequest) returns (GetGroupInfoResponse);
	rpc UpdateGroupInfo(UpdateGroupInfoRequest) returns (UpdateGroupInfoResponse);
	rpc UpdateGroupNotice(UpdateGroupNoticeRequest) returns (UpdateGroupNoticeResponse);
	rpc TransferGroupOwner(TransferGroupOwnerRequest) returns (TransferGroupOwnerResponse);
	rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
	rpc ApplyJoinGroup(ApplyJoinGroupRequest) returns (ApplyJoinGroupResponse);
	rpc CancelJoinGroupApplication(CancelJoinGroupApplicationRequest) returns (CancelJoinGroupApplicationResponse);
	rpc GetMyJoinGroupApplication(GetMyJoinGroupApplicationRequest) returns (GetMyJoinGroupApplicationResponse);
	rpc ReviewJoinGroup(ReviewJoinGroupRequest) returns (ReviewJoinGroupResponse);
	rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse);
	rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
	rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
	rpc GetMemberList(GetMemberListRequest) returns (GetMemberListResponse);
	rpc GetGroupList(GetGroupListRequest) returns (GetGroupListResponse);
	rpc GetGroupMemberIds(GetGroupMemberIdsRequest) returns (GetGroupMemberIdsResponse);
	rpc CheckGroupMember(CheckGroupMemberRequest) returns (CheckGroupMemberResponse);
}
message CreateGroupRequest {
	string name = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
	string avatar = 2;
	repeated string member_uuids = 3;
}
message CreateGroupResponse { string group_uuid = 1; }
message DismissGroupRequest { string group_uuid = 1 [(validate.rules).string.min_len = 1]; }
message DismissGroupResponse {}
message GetGroupInfoRequest { string group_uuid = 1 [(validate.rules).string.min_len = 1]; }
message GetGroupInfoResponse {
	string group_uuid = 1;
	string name = 2;
	string avatar = 3;
	string owner_uuid = 4;
	int32 member_count = 5;
	string notice = 6;
	int32 add_mode = 7;
}
message UpdateGroupInfoRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	optional string name = 2 [(validate.rules).string.max_len = 64];
	optional string avatar = 3;
	optional int32 add_mode = 4 [(validate.rules).int32 = {gte: 0, lte: 1}];
}
message UpdateGroupInfoResponse {}
message UpdateGroupNoticeRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string notice = 2 [(validate.rules).string.max_len = 500];
}
message UpdateGroupNoticeResponse {}
message TransferGroupOwnerRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string target_user_uuid = 2 [(validate.rules).string.min_len = 1];
}
message TransferGroupOwnerResponse {}
message UpdateMemberRoleRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string user_uuid = 2 [(validate.rules).string.min_len = 1];
	int32 role = 3 [(validate.rules).int32 = {gte: 0, lte: 1}];
}
message UpdateMemberRoleResponse {}
message ApplyJoinGroupRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string reason = 2 [(validate.rules).string.max_len = 255];
}
message ApplyJoinGroupResponse {
	int64 apply_id = 1;
	bool joined_directly = 2;
}
message CancelJoinGroupApplicationRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
}
message CancelJoinGroupApplicationResponse {}
message MyJoinGroupApplication {
	int64 apply_id = 1;
	int32 status = 2;
	string reason = 3;
	string reviewer_uuid = 4;
	string review_remark = 5;
	int64 created_at = 6;
	int64 reviewed_at = 7;
}
message GetMyJoinGroupApplicationRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
}
message GetMyJoinGroupApplicationResponse {
	bool has_application = 1;
	MyJoinGroupApplication application = 2;
}
message ReviewJoinGroupRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	int64 apply_id = 2 [(validate.rules).int64 = {gt: 0}];
	int32 action = 3 [(validate.rules).int32 = {gte: 1, lte: 2}];
	string remark = 4 [(validate.rules).string.max_len = 255];
}
message ReviewJoinGroupResponse {}
message GroupJoinRequestItem {
	int64 apply_id = 1;
	string applicant_uuid = 2;
	string nickname = 3;
	string avatar = 4;
	string reason = 5;
	int64 created_at = 6;
}
message ListJoinRequestsRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	int32 page = 2 [(validate.rules).int32 = {gte: 1}];
	int32 page_size = 3 [(validate.rules).int32 = {gte: 1, lte: 100}];
}
message ListJoinRequestsResponse {
	repeated GroupJoinRequestItem items = 1;
	int64 total = 2;
	int32 page = 3;
	int32 page_size = 4;
}
message AddMemberRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	repeated string user_uuids = 2;
}
message AddMemberResponse {}
message RemoveMemberRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string user_uuid = 2 [(validate.rules).string.min_len = 1];
}
message RemoveMemberResponse {}
message GroupMemberItem {
	string user_uuid = 1;
	int32 role = 2;
	string nickname = 3;
	string avatar = 4;
}
message GetMemberListRequest { string group_uuid = 1 [(validate.rules).string.min_len = 1]; }
message GetMemberListResponse { repeated GroupMemberItem members = 1; }
message GetGroupListRequest {}
message GetGroupListResponse {
	repeated GetGroupInfoResponse groups = 1;
}
message GetGroupMemberIdsRequest { string group_uuid = 1 [(validate.rules).string.min_len = 1]; }
message GetGroupMemberIdsResponse { repeated string user_uuids = 1; }
message CheckGroupMemberRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string user_uuid = 2 [(validate.rules).string.min_len = 1];
}
message CheckGroupMemberResponse {
	bool is_member = 1;
	int32 role = 2;
}
