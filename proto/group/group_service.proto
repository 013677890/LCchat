syntax = "proto3";
package group;
option go_package = "github.com/013677890/LCchat-Backend/apps/group/pb";
import "validate/validate.proto";
// ==================== 群组服务接口 ====================
// 服务名：GroupService
// 职责：群资料、群成员、群角色、入群审批
service GroupService {
	rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
	rpc DismissGroup(DismissGroupRequest) returns (DismissGroupResponse);
	rpc GetGroupInfo(GetGroupInfoRequest) returns (GetGroupInfoResponse);
	rpc UpdateGroupInfo(UpdateGroupInfoRequest) returns (UpdateGroupInfoResponse);
	rpc UpdateGroupNotice(UpdateGroupNoticeRequest) returns (UpdateGroupNoticeResponse);
	rpc TransferGroupOwner(TransferGroupOwnerRequest) returns (TransferGroupOwnerResponse);
	rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
	// ApplyJoinGroup 根据群 add_mode 执行直加入群或创建待审批申请。
	// - add_mode=0：直接入群，joined_directly=true；
	// - add_mode=1：创建待审批申请，joined_directly=false 且 apply_id>0。
	rpc ApplyJoinGroup(ApplyJoinGroupRequest) returns (ApplyJoinGroupResponse);
	// CancelJoinGroupApplication 撤销当前登录用户自己发起的待审批申请。
	// 这里只处理 pending 申请，已通过、已拒绝、已撤销记录只读展示，不再回滚状态。
	rpc CancelJoinGroupApplication(CancelJoinGroupApplicationRequest) returns (CancelJoinGroupApplicationResponse);
	// GetMyJoinGroupApplication 获取当前用户在指定群的最新申请状态。
	// 这里返回“最近一次申请事实”，用于单群详情页快速展示审批进度。
	rpc GetMyJoinGroupApplication(GetMyJoinGroupApplicationRequest) returns (GetMyJoinGroupApplicationResponse);
	// ListMyJoinGroupApplications 获取当前登录用户发起的入群申请列表。
	// 返回值已经聚合群名称与头像，避免接入层为了渲染列表再二次回查群资料。
	rpc ListMyJoinGroupApplications(ListMyJoinGroupApplicationsRequest) returns (ListMyJoinGroupApplicationsResponse);
	// ReviewJoinGroup 审批入群申请。
	// action 仅允许：1=通过，2=拒绝。
	rpc ReviewJoinGroup(ReviewJoinGroupRequest) returns (ReviewJoinGroupResponse);
	// ListJoinRequests 获取群待审批申请列表。
	// 只返回待管理员处理的 pending 记录，供群管理端执行审批动作。
	rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse);
	// ListReviewedJoinRequests 获取群已审批申请列表。
	// 这里的“已审批”只包含管理员已通过/已拒绝的历史，不包含申请人主动撤销的记录。
	rpc ListReviewedJoinRequests(ListReviewedJoinRequestsRequest) returns (ListReviewedJoinRequestsResponse);
	rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
	// LeaveGroup 让当前登录用户主动退出群聊。
	// 群主不能直接退群，必须先转让群主或解散群，避免群聚合失去唯一 owner。
	rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
	rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
	rpc GetMemberList(GetMemberListRequest) returns (GetMemberListResponse);
	// SearchGroupMembers 在指定群内按用户 UUID、群名片或昵称搜索成员。
	// 该接口用于大群成员管理页，分页上限固定为 100，避免单次扫描返回过大结果集。
	rpc SearchGroupMembers(SearchGroupMembersRequest) returns (SearchGroupMembersResponse);
	// UpdateMyGroupNickname 更新当前登录用户自己的群名片。
	// 只允许修改自己的群内展示名；管理员代改他人群名片由 UpdateGroupMemberNickname 承载。
	rpc UpdateMyGroupNickname(UpdateMyGroupNicknameRequest) returns (UpdateMyGroupNicknameResponse);
	// UpdateGroupMemberNickname 更新指定成员的群名片。
	// 该接口面向群管理场景：群主可修改管理员/普通成员，管理员只能修改普通成员；
	// 群主或管理员修改自己的群名片时仍应使用 UpdateMyGroupNickname，避免管理权限和自助资料入口混用。
	rpc UpdateGroupMemberNickname(UpdateGroupMemberNicknameRequest) returns (UpdateGroupMemberNicknameResponse);
	// MuteGroupMember 设置或取消指定成员的单人禁言。
	// mute_until=0 表示解除禁言；大于 0 表示禁言截止 Unix 毫秒时间戳。
	rpc MuteGroupMember(MuteGroupMemberRequest) returns (MuteGroupMemberResponse);
	// UpdateGroupMuteSetting 更新全员禁言开关。
	// 开启后普通成员不能发送群消息，群主和管理员仍保留管理沟通能力。
	rpc UpdateGroupMuteSetting(UpdateGroupMuteSettingRequest) returns (UpdateGroupMuteSettingResponse);
	rpc GetGroupList(GetGroupListRequest) returns (GetGroupListResponse);
	// SearchGroups 按群名或完整群号搜索正常群。
	// keyword 命中群号时要求完整 group_uuid 精确相等；命中群名时使用模糊匹配。
	// 空 keyword 直接返回空列表，避免该接口退化成全量群枚举。
	rpc SearchGroups(SearchGroupsRequest) returns (SearchGroupsResponse);
	rpc GetGroupMemberIds(GetGroupMemberIdsRequest) returns (GetGroupMemberIdsResponse);
	rpc CheckGroupMember(CheckGroupMemberRequest) returns (CheckGroupMemberResponse);
	// CheckGroupSendPermission 检查指定用户在群内是否允许发送消息。
	// 该接口面向 msg-service 等内部调用方，用于统一收口群成员、全员禁言和单人禁言判断。
	rpc CheckGroupSendPermission(CheckGroupSendPermissionRequest) returns (CheckGroupSendPermissionResponse);
	// GetJoinRequestPendingCount 获取群待审批入群申请数量。
	// 仅管理员及以上角色可读，用于群管理入口展示红点或待办数量。
	rpc GetJoinRequestPendingCount(GetJoinRequestPendingCountRequest) returns (GetJoinRequestPendingCountResponse);
}
message CreateGroupRequest {
	string name = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
	string avatar = 2;
	repeated string member_uuids = 3;
}
message CreateGroupResponse { string group_uuid = 1; }
message DismissGroupRequest { string group_uuid = 1 [(validate.rules).string.min_len = 1]; }
message DismissGroupResponse {}
message GetGroupInfoRequest { string group_uuid = 1 [(validate.rules).string.min_len = 1]; }
message GetGroupInfoResponse {
	string group_uuid = 1;
	string name = 2;
	string avatar = 3;
	string owner_uuid = 4;
	int32 member_count = 5;
	string notice = 6;
	int32 add_mode = 7;
	bool mute_all = 8;
}
message UpdateGroupInfoRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	optional string name = 2 [(validate.rules).string.max_len = 64];
	optional string avatar = 3;
	optional int32 add_mode = 4 [(validate.rules).int32 = {gte: 0, lte: 1}];
}
message UpdateGroupInfoResponse {}
message UpdateGroupNoticeRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string notice = 2 [(validate.rules).string.max_len = 500];
}
message UpdateGroupNoticeResponse {}
message TransferGroupOwnerRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string target_user_uuid = 2 [(validate.rules).string.min_len = 1];
}
message TransferGroupOwnerResponse {}
message UpdateMemberRoleRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string user_uuid = 2 [(validate.rules).string.min_len = 1];
	int32 role = 3 [(validate.rules).int32 = {gte: 0, lte: 1}];
}
message UpdateMemberRoleResponse {}
message ApplyJoinGroupRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string reason = 2 [(validate.rules).string.max_len = 255];
}
// ApplyJoinGroupResponse 描述入群申请的最终落点。
// - joined_directly=true：表示当前群允许直加，已经直接入群；
// - joined_directly=false：表示已创建待审批申请，此时 apply_id 应大于 0。
message ApplyJoinGroupResponse {
	int64 apply_id = 1;
	bool joined_directly = 2;
}
// CancelJoinGroupApplicationRequest 撤销当前登录用户自己的待审批申请。
// 这里不允许跨用户撤销，也不接受“指定申请单 ID”的方式，避免越权和语义漂移。
message CancelJoinGroupApplicationRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
}
message CancelJoinGroupApplicationResponse {}
// MyJoinGroupApplication 描述当前用户在单个群里的最新申请状态。
// status 约定：0=待审批，1=已通过，2=已拒绝，3=已撤销。
message MyJoinGroupApplication {
	int64 apply_id = 1;
	int32 status = 2;
	string reason = 3;
	string reviewer_uuid = 4;
	string review_remark = 5;
	int64 created_at = 6;
	int64 reviewed_at = 7;
}
message GetMyJoinGroupApplicationRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
}
// GetMyJoinGroupApplicationResponse 返回当前用户在指定群的最新申请状态。
// 当 has_application=false 时，application 为空，表示当前群下尚无申请记录。
message GetMyJoinGroupApplicationResponse {
	bool has_application = 1;
	MyJoinGroupApplication application = 2;
}
// MyJoinGroupApplicationListItem 是“我的申请列表”中的单项读模型。
// 除申请事实外，还直接补齐群名称和头像，方便客户端直接渲染列表卡片。
message MyJoinGroupApplicationListItem {
	int64 apply_id = 1;
	string group_uuid = 2;
	string group_name = 3;
	string group_avatar = 4;
	int32 status = 5;
	string reason = 6;
	string reviewer_uuid = 7;
	string review_remark = 8;
	int64 created_at = 9;
	int64 reviewed_at = 10;
}
// ListMyJoinGroupApplicationsRequest 获取当前用户发起的入群申请列表。
// 采用分页读取，page_size 上限收敛到 100，避免单次拉取过大结果集。
message ListMyJoinGroupApplicationsRequest {
	int32 page = 1 [(validate.rules).int32 = {gte: 1}];
	int32 page_size = 2 [(validate.rules).int32 = {gte: 1, lte: 100}];
	// status 为空表示读取全部状态；传值时按 0待审批/1通过/2拒绝/3撤销过滤。
	optional int32 status = 3 [(validate.rules).int32 = {gte: 0, lte: 3}];
}
// ListMyJoinGroupApplicationsResponse 返回当前用户的入群申请分页列表。
// items 允许同时出现待审批、已通过、已拒绝、已撤销等不同终态记录。
message ListMyJoinGroupApplicationsResponse {
	repeated MyJoinGroupApplicationListItem items = 1;
	int64 total = 2;
	int32 page = 3;
	int32 page_size = 4;
}
// ReviewJoinGroupRequest 描述管理员对入群申请的审批动作。
// action 约定：1=通过，2=拒绝；remark 用于补充审批说明。
message ReviewJoinGroupRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	int64 apply_id = 2 [(validate.rules).int64 = {gt: 0}];
	int32 action = 3 [(validate.rules).int32 = {gte: 1, lte: 2}];
	string remark = 4 [(validate.rules).string.max_len = 255];
}
message ReviewJoinGroupResponse {}
// GroupJoinRequestItem 是待审批申请列表中的单项读模型。
// 只包含管理员审批前需要看到的申请事实与申请人展示信息。
message GroupJoinRequestItem {
	int64 apply_id = 1;
	string applicant_uuid = 2;
	string nickname = 3;
	string avatar = 4;
	string reason = 5;
	int64 created_at = 6;
}
// ListJoinRequestsRequest 获取群待审批申请列表。
// 群范围由 group_uuid 决定，分页参数用于管理端滚动读取待处理记录。
message ListJoinRequestsRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	int32 page = 2 [(validate.rules).int32 = {gte: 1}];
	int32 page_size = 3 [(validate.rules).int32 = {gte: 1, lte: 100}];
}
// ListJoinRequestsResponse 返回待审批申请分页结果。
// 这里只返回 pending 记录，不混入已处理历史。
message ListJoinRequestsResponse {
	repeated GroupJoinRequestItem items = 1;
	int64 total = 2;
	int32 page = 3;
	int32 page_size = 4;
}
// ReviewedJoinRequestItem 是审批记录列表中的单项读模型。
// 相比待审批项，这里额外回显审批结果、审批备注和审批完成时间。
message ReviewedJoinRequestItem {
	int64 apply_id = 1;
	string applicant_uuid = 2;
	string nickname = 3;
	string avatar = 4;
	int32 status = 5;
	string reason = 6;
	string reviewer_uuid = 7;
	string review_remark = 8;
	int64 created_at = 9;
	int64 reviewed_at = 10;
}
// ListReviewedJoinRequestsRequest 获取群已审批申请列表。
// 面向管理员视角读取审批历史，分页规则与待审批列表保持一致。
message ListReviewedJoinRequestsRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	int32 page = 2 [(validate.rules).int32 = {gte: 1}];
	int32 page_size = 3 [(validate.rules).int32 = {gte: 1, lte: 100}];
	// status 为空表示读取全部审批历史；传值时仅允许 1=通过、2=拒绝。
	optional int32 status = 4 [(validate.rules).int32 = {gte: 1, lte: 2}];
}
// ListReviewedJoinRequestsResponse 返回管理员已经处理过的审批记录分页结果。
// 结果只包含“已通过、已拒绝”两类历史，不包含申请人主动撤销记录。
message ListReviewedJoinRequestsResponse {
	repeated ReviewedJoinRequestItem items = 1;
	int64 total = 2;
	int32 page = 3;
	int32 page_size = 4;
}
message AddMemberRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	repeated string user_uuids = 2;
}
message AddMemberResponse {}
message LeaveGroupRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
}
message LeaveGroupResponse {}
message RemoveMemberRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string user_uuid = 2 [(validate.rules).string.min_len = 1];
}
message RemoveMemberResponse {}
message GroupMemberItem {
	string user_uuid = 1;
	int32 role = 2;
	string nickname = 3;
	string avatar = 4;
	string group_nickname = 5;
	int64 mute_until = 6;
}
message GetMemberListRequest { string group_uuid = 1 [(validate.rules).string.min_len = 1]; }
message GetMemberListResponse { repeated GroupMemberItem members = 1; }
message SearchGroupMembersRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string keyword = 2 [(validate.rules).string.max_len = 64];
	int32 page = 3 [(validate.rules).int32 = {gte: 1}];
	int32 page_size = 4 [(validate.rules).int32 = {gte: 1, lte: 100}];
}
message SearchGroupMembersResponse {
	repeated GroupMemberItem members = 1;
	int64 total = 2;
	int32 page = 3;
	int32 page_size = 4;
}
message UpdateMyGroupNicknameRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string group_nickname = 2 [(validate.rules).string.max_len = 64];
}
message UpdateMyGroupNicknameResponse {}
// UpdateGroupMemberNicknameRequest 描述管理员代改成员群名片的请求。
// user_uuid 是目标成员 UUID，不从 body 之外推断，便于 gRPC 调用方明确表达被修改对象。
message UpdateGroupMemberNicknameRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string user_uuid = 2 [(validate.rules).string.min_len = 1];
	string group_nickname = 3 [(validate.rules).string.max_len = 64];
}
message UpdateGroupMemberNicknameResponse {}
message MuteGroupMemberRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string user_uuid = 2 [(validate.rules).string.min_len = 1];
	int64 mute_until = 3 [(validate.rules).int64 = {gte: 0}];
}
message MuteGroupMemberResponse {}
message UpdateGroupMuteSettingRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	bool mute_all = 2;
}
message UpdateGroupMuteSettingResponse {}
message GetGroupListRequest {}
message GetGroupListResponse {
	repeated GetGroupInfoResponse groups = 1;
}
// GroupSearchItem 是群搜索列表项。
// 搜索结果只暴露申请入群前必要的公开资料，不包含公告、群主、禁言等管理字段。
message GroupSearchItem {
	string group_uuid = 1;
	string name = 2;
	string avatar = 3;
	int32 member_count = 4;
	int32 add_mode = 5;
}
// SearchGroupsRequest 按群名或完整群号搜索正常群。
// keyword 为空时返回空结果；page/page_size 用于限制大结果集的单次返回量。
message SearchGroupsRequest {
	string keyword = 1 [(validate.rules).string.max_len = 64];
	int32 page = 2 [(validate.rules).int32 = {gte: 1}];
	int32 page_size = 3 [(validate.rules).int32 = {gte: 1, lte: 100}];
}
message SearchGroupsResponse {
	repeated GroupSearchItem groups = 1;
	int64 total = 2;
	int32 page = 3;
	int32 page_size = 4;
}
message GetGroupMemberIdsRequest { string group_uuid = 1 [(validate.rules).string.min_len = 1]; }
message GetGroupMemberIdsResponse { repeated string user_uuids = 1; }
message CheckGroupMemberRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string user_uuid = 2 [(validate.rules).string.min_len = 1];
}
message CheckGroupMemberResponse {
	bool is_member = 1;
	int32 role = 2;
}
message CheckGroupSendPermissionRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
	string user_uuid = 2 [(validate.rules).string.min_len = 1];
}
message CheckGroupSendPermissionResponse {
	bool can_send = 1;
	int32 role = 2;
	string reason = 3;
	int64 mute_until = 4;
	bool mute_all = 5;
}
message GetJoinRequestPendingCountRequest {
	string group_uuid = 1 [(validate.rules).string.min_len = 1];
}
message GetJoinRequestPendingCountResponse { int64 count = 1; }
