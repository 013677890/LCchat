syntax = "proto3";

package user;

option go_package = "github.com/013677890/LCchat-Backend/apps/user/pb";

import "validate/validate.proto";

// ==================== 群组服务接口 ====================
// 服务名：GroupService
// 职责：提供群成员查询等群基础能力，供 message-push 等内部服务使用。
service GroupService {
  // GetGroupMembers 获取群组有效成员列表。
  rpc GetGroupMembers(GetGroupMembersRequest) returns (GetGroupMembersResponse);
}

// GetGroupMembersRequest 获取群成员列表请求。
message GetGroupMembersRequest {
  string group_uuid = 1 [(validate.rules).string.min_len = 1];
}

// GroupMemberItem 群成员项。
message GroupMemberItem {
  string user_uuid = 1;
  int32 role = 2;
}

// GetGroupMembersResponse 获取群成员列表响应。
message GetGroupMembersResponse {
  repeated GroupMemberItem members = 1;
}
