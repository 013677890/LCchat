syntax = "proto3";

package user;

option go_package = "github.com/013677890/LCchat-Backend/apps/user/pb";

import "validate/validate.proto";

// ==================== 通用数据模型（旧版兼容，Phase 3 后删除）====================
// UserInfo / SimpleUserInfo / SimpleUserItem / PaginationInfo 已迁移到 user_service.proto
// 此文件仅保留 DeviceInfo / OnlineStatus / TagItem 等 auth/device/friend 依赖的类型

// ==================== 设备信息 ====================

// DeviceInfo 设备信息
message DeviceInfo {
	string device_name = 1 [(validate.rules).string.max_len = 64];
	string platform = 2 [(validate.rules).string = {in: ["iOS", "Android", "Web", "Windows", "Mac"]}];
	string os_version = 3 [(validate.rules).string.max_len = 32];
	string app_version = 4 [(validate.rules).string.max_len = 32];
}

// ==================== 分页信息 ====================

// PaginationInfo 分页信息
message PaginationInfo {
	int32 page = 1;
	int32 page_size = 2;
	int64 total = 3;
	int32 total_pages = 4;
}

// ==================== 标签信息 ====================

// TagItem 标签项
message TagItem {
	string tag_name = 1;
	int32 count = 2;
}

// ==================== 在线状态 ====================

// OnlineStatus 在线状态
message OnlineStatus {
	string user_uuid = 1;
	bool is_online = 2;
	int64 last_seen_at = 3;
	repeated string online_platforms = 4;
}

// OnlineStatusItem 在线状态项（批量）
message OnlineStatusItem {
	string user_uuid = 1;
	bool is_online = 2;
	int64 last_seen_at = 3;
}
