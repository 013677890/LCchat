syntax = "proto3";

package user;

option go_package = "github.com/013677890/LCchat-Backend/apps/user/pb";

import "validate/validate.proto";

// ==================== 用户资料服务接口 ====================
// 服务名：UserService
// 职责：用户资料管理、搜索用户、头像、二维码名片
// 注意：密码/邮箱/手机绑定/注销 已迁移到 auth.AccountService

service UserService {
	// GetProfile 获取个人信息
	// 建议调用超时：300ms。
	rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

	// GetOtherProfile 获取他人信息
	// 建议调用超时：300ms。
	rpc GetOtherProfile(GetOtherProfileRequest) returns (GetOtherProfileResponse);

	// SearchUser 搜索用户
	// 建议调用超时：800ms。
	rpc SearchUser(SearchUserRequest) returns (SearchUserResponse);

	// UpdateProfile 更新基本信息
	// 成功后异步回写 auth 冗余字段（见 InternalAuthService.UpdateLoginDisplay）
	// 建议调用超时：500ms。
	rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

	// UploadAvatar 上传头像
	// 成功后异步回写 auth 冗余字段
	// 建议调用超时：500ms。
	rpc UploadAvatar(UploadAvatarRequest) returns (UploadAvatarResponse);

	// GetQRCode 获取用户二维码
	// 建议调用超时：300ms。
	rpc GetQRCode(GetQRCodeRequest) returns (GetQRCodeResponse);

	// ParseQRCode 解析二维码
	// 建议调用超时：300ms。
	rpc ParseQRCode(ParseQRCodeRequest) returns (ParseQRCodeResponse);

	// BatchGetProfile 批量获取用户信息
	// 建议调用超时：800ms。
	rpc BatchGetProfile(BatchGetProfileRequest) returns (BatchGetProfileResponse);
}

// ==================== 通用用户类型 ====================

// UserInfo 用户完整信息（来自 user_profile）
message UserInfo {
	string uuid = 1;
	string nickname = 2;
	string avatar = 3;
	int32 gender = 4;
	string signature = 5;
	string birthday = 6;
}

// SimpleUserInfo 简化用户信息（用于批量查询）
message SimpleUserInfo {
	string uuid = 1;
	string nickname = 2;
	string avatar = 3;
	int32 gender = 4;
	string signature = 5;
}

// SimpleUserItem 搜索结果用户项
message SimpleUserItem {
	string uuid = 1;
	string nickname = 2;
	reserved 3; // email 已移除
	string avatar = 4;
	string signature = 5;
	bool is_friend = 6;
}

// PaginationInfo 分页信息。
message PaginationInfo {
	int32 page = 1;
	int32 page_size = 2;
	int64 total = 3;
	int32 total_pages = 4;
}

// ==================== 获取个人信息 ====================

// GetProfileRequest 获取个人信息请求
message GetProfileRequest {}

// GetProfileResponse 获取个人信息响应
message GetProfileResponse {
	UserInfo user_info = 1;
}

// ==================== 获取他人信息 ====================

// GetOtherProfileRequest 获取他人信息请求
message GetOtherProfileRequest {
	string user_uuid = 1 [(validate.rules).string.min_len = 1];
}

// GetOtherProfileResponse 获取他人信息响应
message GetOtherProfileResponse {
	UserInfo user_info = 1;
}

// ==================== 搜索用户 ====================

// SearchUserRequest 搜索用户请求
message SearchUserRequest {
	string keyword = 1 [(validate.rules).string = {min_len: 1}];
	int32 page = 2 [(validate.rules).int32 = {gte: 1}];
	int32 page_size = 3 [(validate.rules).int32 = {gte: 1, lte: 100}];
}

// SearchUserResponse 搜索用户响应
message SearchUserResponse {
	repeated SimpleUserItem items = 1;
	PaginationInfo pagination = 2;
}

// ==================== 更新基本信息 ====================

// UpdateProfileRequest 更新基本信息请求
message UpdateProfileRequest {
	string nickname = 1 [(validate.rules).string = {ignore_empty: true, min_len: 2, max_len: 20}];
	int32 gender = 2 [(validate.rules).int32 = {ignore_empty: true, in: [1, 2, 3]}]; // 1:男 2:女 3:未知；0 表示未传
	optional string birthday = 3 [(validate.rules).string = {}]; // YYYY-MM-DD；空字符串表示清空
	optional string signature = 4 [(validate.rules).string.max_len = 100]; // 空字符串表示清空
}

// UpdateProfileResponse 更新基本信息响应
message UpdateProfileResponse {
	UserInfo user_info = 1;
}

// ==================== 上传头像 ====================

// UploadAvatarRequest 上传头像请求
message UploadAvatarRequest {
	string avatar_url = 1 [(validate.rules).string.min_len = 1];
}

// UploadAvatarResponse 上传头像响应
message UploadAvatarResponse {
	string avatar_url = 1;
}

// ==================== 二维码相关 ====================

// GetQRCodeRequest 获取二维码请求
message GetQRCodeRequest {}

// GetQRCodeResponse 获取二维码响应
message GetQRCodeResponse {
	string qrcode = 1;
	string expire_at = 2;
}

// ParseQRCodeRequest 解析二维码请求
message ParseQRCodeRequest {
	string token = 1 [(validate.rules).string.min_len = 1];
}

// ParseQRCodeResponse 解析二维码响应
message ParseQRCodeResponse {
	string user_uuid = 1;
}

// ==================== 批量获取用户信息 ====================

// BatchGetProfileRequest 批量获取用户信息请求
message BatchGetProfileRequest {
	repeated string user_uuids = 1 [(validate.rules).repeated.max_items = 100];
}

// BatchGetProfileResponse 批量获取用户信息响应
message BatchGetProfileResponse {
	repeated SimpleUserInfo users = 1;
}
