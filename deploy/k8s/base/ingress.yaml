apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lcchat
  labels:
    app.kubernetes.io/part-of: lcchat
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: lcchat.local
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: connect-ws
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
