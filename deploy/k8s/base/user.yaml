apiVersion: v1
kind: Service
metadata:
  name: user
  labels:
    app.kubernetes.io/name: user
    app.kubernetes.io/part-of: lcchat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user
  ports:
    - name: grpc
      port: 9094
      targetPort: grpc
    - name: metrics
      port: 9194
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    app.kubernetes.io/name: user
    app.kubernetes.io/part-of: lcchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user
        app.kubernetes.io/part-of: lcchat
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user
          image: lcchat:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/user
          command: ["go", "run", "./cmd"]
          envFrom:
            - configMapRef:
                name: lcchat-common-config
            - secretRef:
                name: lcchat-secret
          env:
            - name: USER_GRPC_ADDR
              value: ":9094"
            - name: USER_METRICS_ADDR
              value: ":9194"
          ports:
            - name: grpc
              containerPort: 9094
            - name: metrics
              containerPort: 9194
          startupProbe:
            grpc:
              port: 9094
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 9094
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 9094
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
