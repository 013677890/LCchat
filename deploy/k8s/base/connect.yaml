apiVersion: v1
kind: Service
metadata:
  name: connect-headless
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/part-of: lcchat
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: connect
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: grpc
      port: 9091
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: connect-ws
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/part-of: lcchat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: connect
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: connect
  labels:
    app.kubernetes.io/name: connect
    app.kubernetes.io/part-of: lcchat
spec:
  serviceName: connect-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connect
        app.kubernetes.io/part-of: lcchat
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: connect
          image: lcchat:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/connect
          command: ["go", "run", "./cmd"]
          envFrom:
            - configMapRef:
                name: lcchat-common-config
            - secretRef:
                name: lcchat-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONNECT_ADDR
              value: ":8081"
            - name: CONNECT_GRPC_ADDR
              value: ":9091"
            - name: CONNECT_SELF_GRPC_ADDR
              value: "$(POD_NAME).connect-headless.$(POD_NAMESPACE).svc.cluster.local:9091"
            - name: AUTH_GRPC_ADDR
              value: auth:9090
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 9091
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
