apiVersion: v1
kind: Service
metadata:
  name: relation
  labels:
    app.kubernetes.io/name: relation
    app.kubernetes.io/part-of: lcchat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: relation
  ports:
    - name: grpc
      port: 9093
      targetPort: grpc
    - name: metrics
      port: 9193
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relation
  labels:
    app.kubernetes.io/name: relation
    app.kubernetes.io/part-of: lcchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relation
        app.kubernetes.io/part-of: lcchat
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: relation
          image: lcchat:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/relation"]
          envFrom:
            - configMapRef:
                name: lcchat-common-config
            - secretRef:
                name: lcchat-secret
          env:
            - name: RELATION_GRPC_ADDR
              value: ":9093"
            - name: RELATION_METRICS_ADDR
              value: ":9193"
          ports:
            - name: grpc
              containerPort: 9093
            - name: metrics
              containerPort: 9193
          startupProbe:
            grpc:
              port: 9093
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 9093
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
