apiVersion: v1
kind: Service
metadata:
  name: group
  labels:
    app.kubernetes.io/name: group
    app.kubernetes.io/part-of: lcchat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: group
  ports:
    - name: grpc
      port: 9095
      targetPort: grpc
    - name: metrics
      port: 9195
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: group
  labels:
    app.kubernetes.io/name: group
    app.kubernetes.io/part-of: lcchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: group
  template:
    metadata:
      labels:
        app.kubernetes.io/name: group
        app.kubernetes.io/part-of: lcchat
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: group
          image: lcchat:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/group
          command: ["go", "run", "./cmd"]
          envFrom:
            - configMapRef:
                name: lcchat-common-config
            - secretRef:
                name: lcchat-secret
          env:
            - name: GROUP_GRPC_ADDR
              value: ":9095"
            - name: GROUP_METRICS_ADDR
              value: ":9195"
          ports:
            - name: grpc
              containerPort: 9095
            - name: metrics
              containerPort: 9195
          startupProbe:
            grpc:
              port: 9095
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 9095
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 9095
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
