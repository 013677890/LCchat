apiVersion: v1
kind: Service
metadata:
  name: message-push
  labels:
    app.kubernetes.io/name: message-push
    app.kubernetes.io/part-of: lcchat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: message-push
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-push
  labels:
    app.kubernetes.io/name: message-push
    app.kubernetes.io/part-of: lcchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: message-push
  template:
    metadata:
      labels:
        app.kubernetes.io/name: message-push
        app.kubernetes.io/part-of: lcchat
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: message-push
          image: lcchat:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/message-push"]
          envFrom:
            - configMapRef:
                name: lcchat-common-config
            - secretRef:
                name: lcchat-secret
          env:
            - name: MESSAGE_PUSH_HTTP_ADDR
              value: ":8084"
            - name: GROUP_GRPC_ADDR
              value: group:9095
          ports:
            - name: http
              containerPort: 8084
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
