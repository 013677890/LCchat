apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: lcchat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: metrics
      port: 9190
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: lcchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/part-of: lcchat
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth
          image: lcchat:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/auth"]
          envFrom:
            - configMapRef:
                name: lcchat-common-config
            - secretRef:
                name: lcchat-secret
          env:
            - name: AUTH_GRPC_ADDR
              value: ":9090"
            - name: AUTH_METRICS_ADDR
              value: ":9190"
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9190
          startupProbe:
            grpc:
              port: 9090
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
