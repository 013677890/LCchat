apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: lcchat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: lcchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: lcchat
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: lcchat:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/gateway
          command: ["go", "run", "./cmd"]
          envFrom:
            - configMapRef:
                name: lcchat-common-config
            - secretRef:
                name: lcchat-secret
          env:
            - name: GATEWAY_ADDR
              value: ":8080"
            - name: AUTH_SERVICE_ADDR
              value: auth:9090
            - name: USER_SERVICE_ADDR
              value: user:9094
            - name: RELATION_SERVICE_ADDR
              value: relation:9093
            - name: GROUP_SERVICE_ADDR
              value: group:9095
            - name: MSG_SERVICE_ADDR
              value: msg:9092
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
