apiVersion: v1
kind: Service
metadata:
  name: msg
  labels:
    app.kubernetes.io/name: msg
    app.kubernetes.io/part-of: lcchat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: msg
  ports:
    - name: grpc
      port: 9092
      targetPort: grpc
    - name: metrics
      port: 9192
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: msg
  labels:
    app.kubernetes.io/name: msg
    app.kubernetes.io/part-of: lcchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: msg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: msg
        app.kubernetes.io/part-of: lcchat
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: msg
          image: lcchat:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/msg"]
          envFrom:
            - configMapRef:
                name: lcchat-common-config
            - secretRef:
                name: lcchat-secret
          env:
            - name: MSG_GRPC_ADDR
              value: ":9092"
            - name: MSG_METRICS_ADDR
              value: ":9192"
            - name: GROUP_GRPC_ADDR
              value: group:9095
            - name: RELATION_GRPC_ADDR
              value: relation:9093
          ports:
            - name: grpc
              containerPort: 9092
            - name: metrics
              containerPort: 9192
          startupProbe:
            grpc:
              port: 9092
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 9092
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
