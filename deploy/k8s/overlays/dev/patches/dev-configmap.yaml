apiVersion: v1
kind: ConfigMap
metadata:
  name: lcchat-common-config
data:
  # WSL2 原生 k3s 复用 Windows Docker 基础设施，通过同名 Service + Endpoints 接入。
  TZ: Asia/Shanghai
  GIN_MODE: release

  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: chat_server
  MYSQL_LOG_LEVEL: warn

  REDIS_ADDR: redis:6379
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "20"
  REDIS_MIN_IDLE_CONNS: "4"
  REDIS_MAX_RETRIES: "3"

  # Kafka advertised.listeners 为 kafka:9092，因此这里保持同名 Service。
  KAFKA_BROKERS: kafka:9092
  KAFKA_AUTH_REDIS_RETRY_TOPIC: auth.redis.invalidate
  KAFKA_AUTH_REDIS_RETRY_GROUP_ID: auth-redis-invalidate-group
  KAFKA_USER_REDIS_RETRY_TOPIC: user.redis.invalidate
  KAFKA_USER_REDIS_RETRY_GROUP_ID: user-redis-invalidate-group
  KAFKA_RELATION_REDIS_RETRY_TOPIC: relation.redis.invalidate
  KAFKA_RELATION_REDIS_RETRY_GROUP_ID: relation-redis-invalidate-group
  KAFKA_RETRY_GROUP_ID: redis-retry-consumer-group
  KAFKA_USER_CREATED_TOPIC: user_created
  KAFKA_PROFILE_DISPLAY_CHANGED_TOPIC: profile_display_changed
  KAFKA_ACCOUNT_DELETED_TOPIC: account.deleted
  KAFKA_MSG_PUSH_TOPIC: msg.push
  KAFKA_MSG_PUSH_GROUP_ID: message-push-consumer-group
  KAFKA_REALTIME_PUSH_TOPIC: realtime.push
  KAFKA_REALTIME_PUSH_GROUP_ID: realtime-push-consumer-group
  KAFKA_GROUP_CACHE_TOPIC: group.cache
  KAFKA_GROUP_CACHE_GROUP_ID: group-cache-projector-group
  KAFKA_MSG_GROUP_MEMBERSHIP_GROUP_ID: msg-group-membership-projector-group
  KAFKA_GROUP_CACHE_PROJECTOR_CONCURRENCY: "3"
  KAFKA_MSG_GROUP_MEMBERSHIP_PROJECTOR_CONCURRENCY: "3"
  GROUP_CACHE_RECONCILE_INTERVAL: 6h
  GROUP_CACHE_RECONCILE_BATCH_SIZE: "100"

  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: chatserver
  MINIO_BASE_URL: http://localhost:9000
  MINIO_USE_SSL: "false"
  MINIO_PUBLIC_READ: "true"

  MESSAGE_PUSH_ROUTE_TTL_SECONDS: "180"
  MESSAGE_PUSH_CONNECT_TIMEOUT_USER_MS: "150"
  MESSAGE_PUSH_MAX_FANOUT_CONCURRENCY: "32"

  EMAIL_SENDER: 2315635418@qq.com
  EMAIL_SENDER_NAME: LCChat
  EMAIL_SMTP_HOST: smtp.qq.com
  EMAIL_SMTP_PORT: "465"
